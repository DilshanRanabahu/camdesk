[project]
name = "camdesk"
version = "0.1.0"
description = "View, record and control an Android IP Webcam from Windows"
authors = [
    { name = "DilshanRanabahu" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "av>=19.0.2",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "numpy>=2.5.5",
    "pyside6-essentials>=6.12",
]

[project.scripts]
camdesk = "camdesk:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "nuitka>=4.3.5",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "A", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow ×, μ, – etc. in strings/comments
